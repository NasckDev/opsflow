<app-modal
  [open]="shortcuts.paletteOpen()"
  [title]="'palette.title' | t"
  [width]="560"
  [centered]="false"
  className="app-palette"
  [autofocus]="null"
  (closed)="close()"
>
  <div role="presentation" (keydown)="onKeydown($event)">
    <app-input
      type="search"
      prefixIcon="search"
      inputId="palette-field"
      [ariaLabel]="'palette.placeholder' | t"
      [placeholder]="'palette.placeholder' | t"
      [ngModel]="query()"
      (ngModelChange)="onQuery($event)"
    />
    <ul id="palette-list" class="results" role="listbox" [attr.aria-label]="'palette.title' | t">
      @for (command of results(); track command.id; let i = $index) {
        <li
          role="option"
          tabindex="-1"
          [id]="'palette-opt-' + i"
          [attr.aria-selected]="i === active()"
          [class.active]="i === active()"
          (click)="execute(command)"
          (keydown.enter)="execute(command)"
          (mouseenter)="active.set(i)"
        >
          <app-icon [name]="command.icon" />
          <span class="label">{{ command.label }}</span>
          @if (command.hint) {
            <span class="mono muted">{{ command.hint }}</span>
          }
          <span class="group">{{ 'palette.group.' + command.group | t }}</span>
        </li>
      } @empty {
        <li class="empty" role="presentation">{{ 'palette.empty' | t }}</li>
      }
    </ul>
  </div>
</app-modal>
