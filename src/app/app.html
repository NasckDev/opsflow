<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">{{ 'app.skip' | t }}</a>

<header class="topbar">
  <a class="brand" routerLink="/requests">
    <span class="logo" aria-hidden="true">⟳</span>
    <span>
      <strong>OpsFlow</strong>
      <small>{{ 'app.tagline' | t }}</small>
    </span>
  </a>

  <div class="controls">
    <div class="control">
      <label for="role-select">{{ 'app.role' | t }}</label>
      <select id="role-select" [value]="session.currentRole()" (change)="onRole($event)">
        @for (role of roles; track role) {
          <option [value]="role">{{ 'role.' + role | t }}</option>
        }
      </select>
    </div>
    <div class="control">
      <label for="locale-select">{{ 'app.language' | t }}</label>
      <select id="locale-select" [value]="i18n.locale()" (change)="onLocale($event)">
        @for (locale of locales; track locale) {
          <option [value]="locale">{{ locale === 'en' ? 'English' : 'Português' }}</option>
        }
      </select>
    </div>
    <button type="button" class="btn btn-icon" [attr.aria-pressed]="theme.theme() === 'dark'" (click)="theme.toggle()">
      <span aria-hidden="true">{{ theme.theme() === 'dark' ? '☀' : '☾' }}</span>
      {{ 'app.theme.dark' | t }}
    </button>
    <label class="toggle">
      <input type="checkbox" [checked]="backend.failuresEnabled()" (change)="onFailures($event)" />
      {{ 'app.simulateErrors' | t }}
    </label>
  </div>
  <p class="acting-as">{{ 'app.actingAs' | t: { name: session.actor().name } }}</p>
</header>

<main id="main" #main tabindex="-1">
  <router-outlet />
</main>
