<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>OpsFlow · Console de workflow e aprovações</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OpsFlow: console de workflow e aprovações com RBAC, SLA e trilha de auditoria (demo com dados fictícios).">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema antes do primeiro paint para evitar o flash claro/escuro.
    try {
      var stored = localStorage.getItem('opsflow.theme');
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {
      /* sem storage: o app define o tema ao iniciar */
    }
  </script>
<link rel="stylesheet" href="styles-UDZJHEVV.css"><link rel="stylesheet" href="theme-light-KDFKAH7Z.css"><link rel="stylesheet" href="theme-dark-23OQ5C3T.css"></head>
<body>
  <script>
    // Só a folha de estilo do tema ativo vale (as duas vêm no index; ver UiTheme).
    try {
      var dark = document.documentElement.dataset.theme === 'dark';
      document.querySelectorAll('link[rel=stylesheet]').forEach(function (link) {
        if (link.href.indexOf('theme-dark') > -1) link.media = dark ? 'all' : 'not all';
        else if (link.href.indexOf('theme-light') > -1) link.media = dark ? 'not all' : 'all';
      });
    } catch (e) {
      /* sem DOM: o app ajusta ao iniciar */
    }
  </script>
  <app-root></app-root>
<script src="main-OP67W4QP.js" type="module"></script></body>
</html>
